name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ecom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ecom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ecom_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm pipeline run --scale 0.1
      - run: docker compose run --rm pipeline run --scale 0.1   # rerun: must be idempotent
      - run: docker compose run --rm pipeline runs
      - if: always()
        run: docker compose down -v
