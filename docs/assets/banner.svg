<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="E-commerce Pipeline: Raw files to a PostgreSQL star schema, reconciled to the cent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#818cf8"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#818cf8" letter-spacing="2">30 DAYS · DAY 01</text>
  <text x="92" y="152" class="sans" font-size="65" font-weight="800" fill="url(#shine)">E-commerce Pipeline</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Raw files to a PostgreSQL star schema, reconciled to the cent</text>
  <rect x="96" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#818cf8" stroke-opacity="0.45"/><text x="132" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Python</text><rect x="177" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#818cf8" stroke-opacity="0.45"/><text x="213" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Polars</text><rect x="258" y="262" width="104" height="28" rx="14" fill="#161b22" stroke="#818cf8" stroke-opacity="0.45"/><text x="310" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">PostgreSQL</text><rect x="372" y="262" width="55" height="28" rx="14" fill="#161b22" stroke="#818cf8" stroke-opacity="0.45"/><text x="400" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">COPY</text>
  <g><g class="fade d1"><path d="M870 80 h26 l10 10 v26 h-36 z" fill="#161b22" stroke="#8b949e"/><text x="888" y="106" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">.pq</text></g><path d="M910 98 C960 98 980 180 1000 180" class="flow" stroke="#8b949e" stroke-width="2" fill="none"/><g class="fade d2"><path d="M870 130 h26 l10 10 v26 h-36 z" fill="#161b22" stroke="#8b949e"/><text x="888" y="156" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">.pq</text></g><path d="M910 148 C960 148 980 180 1000 180" class="flow" stroke="#8b949e" stroke-width="2" fill="none"/><line class="draw d3" x1="1060" y1="180" x2="1060" y2="70" stroke="#818cf8" stroke-width="2"/><g class="fade d4"><rect x="1004" y="52" width="112" height="36" rx="9" fill="#161b22" stroke="#818cf8"/><text x="1060" y="75" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">dim_date</text></g><line class="draw d4" x1="1060" y1="180" x2="1190" y2="250" stroke="#818cf8" stroke-width="2"/><g class="fade d5"><rect x="1134" y="232" width="112" height="36" rx="9" fill="#161b22" stroke="#818cf8"/><text x="1190" y="255" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">dim_product</text></g><line class="draw d5" x1="1060" y1="180" x2="930" y2="250" stroke="#818cf8" stroke-width="2"/><g class="fade d6"><rect x="874" y="232" width="112" height="36" rx="9" fill="#161b22" stroke="#818cf8"/><text x="930" y="255" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">dim_customer</text></g><g class="fade d2"><rect x="998" y="156" width="124" height="48" rx="10" fill="#818cf8"/><text x="1060" y="185" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0b1016">fact_orders</text></g><g class="fade d8"><rect x="995" y="296" width="130" height="28" rx="14" fill="#161b22" stroke="#3fb950"/><text x="1060" y="315" text-anchor="middle" class="mono" font-size="12" fill="#3fb950">reconciled ✓</text></g></g>
</svg>
